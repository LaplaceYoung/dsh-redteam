- insert:
    - id: redteam-ui
      name: dsh-redteam
      config:
        surface: ui
        storagePath: !!js dshHomePath('storages', 'redteam.json')
        reaCommand: "rea"
        trafficCommand: "mitmdump"
        plannerConcurrency: 3
    - id: preset-redteam
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: redteam
        name: 红队模式
        description: ARTEX 任务协作、资产图与 REA 分析工作区
        order: 3
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a red-team research agent powered by the {{model}} model.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: >
                    You are in plan mode. Explore the task with non-mutating reads,
                    searches, and analysis. Do not edit files, change configuration,
                    or execute the proposed implementation while this mode is active.
                    Resolve discoverable facts by inspection and ask_user_question
                    only for user-owned choices or material ambiguity. Describe the
                    objective, affected components, data flow, failure handling,
                    validation, and acceptance criteria in a decision-complete plan.
                    When ready, call exit_plan_mode with the complete plan markdown,
                    starting with a # title, as the final tool call in that response.
                    Stay in plan mode until that review approves the plan or the user
                    switches the session mode. If review is unavailable or aborted,
                    keep the plan pending; do not treat a conversational answer as
                    approval to execute it.
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
              agentTeams: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
              # ARTEX's named Workers use the host-native Agent Teams service.
              # Keep the ordinary subagent/workflow tools above: WorkerRuntime
              # uses the service directly, while Lead sessions retain the DSH
              # dynamic workflow and legacy delegation surfaces.
              - id: agent-team
                name: '@deepseek-ai/dsh-experimental-agent-team'
                config:
                  maxMembers: 16
                  maxTasks: 256
                  maxMessageBytes: 65536
                  disposalTimeoutMs: 5000
              - id: tool-agent-team
                name: '@deepseek-ai/dsh-experimental-tool-agent-team'
                config:
                  freshProvider: spawn
                  forkProvider: fork
              - id: ui-agent-team
                name: '@deepseek-ai/dsh-experimental-client-ui-agent-team'
              - id: redteam-agent
                name: dsh-redteam
                config:
                  surface: agent
                  storagePath: !!js dshHomePath('storages', 'redteam.json')
                  reaCommand: "rea"
                  trafficCommand: "mitmdump"
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-presentation
            name: '@deepseek-ai/dsh-agent-tool-presentation'
            config:
              mode: native
